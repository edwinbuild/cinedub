[project]
name = "cinedub"
version = "0.1.0"
description = "Provider-neutral cinema dubbing workspace"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "anyio>=4.8,<4.15",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
